name: Build TeslaMIDI IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Inspect Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project TeslaMIDI/TeslaMIDI.xcodeproj \
            -scheme TeslaMIDI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TeslaMIDI.app Payload/
          zip -qr TeslaMIDI.ipa Payload
          rm -rf Payload
          echo "IPA created successfully: $(ls -lh TeslaMIDI.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaMIDI-SideStore
          path: TeslaMIDI.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with Direct IPA Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.1
          name: "TeslaMIDI v1.7.1 - Risoluzione Bug Nota Fissa Continua al Cambio Brano"
          body: |
            ### ⚡ TeslaMIDI v1.7.1 - Bobina di Tesla Bluetooth Interrupter per iOS
            
            Novità in v1.7.1:
            - 🎵 **Risolto Definitivamente il Bug della Nota Fissa Continua**:
              - Eliminata la race condition multi-thread tra il timer MIDI in background e il thread principale.
              - Introdotto un **token di sessione atomico** (`playbackSessionId`): quando si avvia un nuovo brano o si preme stop/pausa, qualsiasi evento residuo del brano precedente viene scartato istantaneamente prima di raggiungere la bobina o l'altoparlante.
              - **Silenziamento istantaneo**: azzeramento immediato del sintetizzatore audio iPhone e invio Note Off garantito all'ESP32.
              - Implementato il metodo dedicato `play(song:)` per avviare sempre i nuovi brani da capo a tempo 0.0, senza falsi stati di ripresa (resume).
            - 📁 **Importazione File MIDI a Tocco Singolo (File / iCloud)**:
              - Tocco diretto sul file `.mid` senza bisogno del tasto "Apri".
            - ⏸️ **Visualizzatore Statico in Pausa**:
              - Cerchio fermo e azzeramento duty cycle quando la bobina non sta suonando.
            
            Scarica **`TeslaMIDI.ipa`** direttamente da Safari sul tuo iPhone e seleziona **Condividi -> Apri con SideStore** (o AltStore) per aggiornare!
          files: TeslaMIDI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
