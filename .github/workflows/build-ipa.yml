name: Build TeslaMIDI IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Inspect Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project TeslaMIDI/TeslaMIDI.xcodeproj \
            -scheme TeslaMIDI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TeslaMIDI.app Payload/
          zip -qr TeslaMIDI.ipa Payload
          rm -rf Payload
          echo "IPA created successfully: $(ls -lh TeslaMIDI.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaMIDI-SideStore
          path: TeslaMIDI.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with Direct IPA Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: "TeslaMIDI v1.9.0 - Generatore Hardware Segnale Test 200 kHz per Circuiti & Gate Driver"
          body: |
            ### ⚡ TeslaMIDI v1.9.0 - Supporto Generatore Segnale Hardware 200 kHz
            
            Novità in v1.9.0:
            - 🔬 **Generatore Hardware Onda Quadra 200 kHz su Pin D2 (GPIO 4)**:
              - Genera un segnale ad onda quadra continuo a **200 kHz** (duty cycle 50%, periodo 5.0 µs esatti) per il collaudo di gate driver, semiponti H-Bridge, trasformatori GDT e circuiti di risonanza.
              - Basato sul **Timer1 hardware** ad altissima precisione temporale (tick a 12.5 ns).
              - Attivabile e disattivabile con un tocco direttamente dall'app iOS o dalla pagina web di emergenza dell'ESP8266 (`http://192.168.4.1/test200k`).
              - Rimane attivo in modo continuo finché non viene fermato manualmente dall'utente o dall'Arresto di Emergenza (Kill Switch).
              - Banner di stato in tempo reale nell'interfaccia principale dell'app.
            - 📡 **Supporto Completo Dual-Mode**:
              - Wi-Fi UDP a bassissima latenza per ESP8266 NodeMCU (uscita interrupter su **Pin D1**).
              - Bluetooth BLE per ESP32.
              - Monitoraggio ping in millisecondi in tempo reale.
            
            Scarica **`TeslaMIDI.ipa`** direttamente da Safari sul tuo iPhone e seleziona **Condividi -> Apri con SideStore** (o AltStore) per installare!
          files: TeslaMIDI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
