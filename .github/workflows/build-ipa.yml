name: Build TeslaMIDI IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Inspect Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project TeslaMIDI/TeslaMIDI.xcodeproj \
            -scheme TeslaMIDI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TeslaMIDI.app Payload/
          zip -qr TeslaMIDI.ipa Payload
          rm -rf Payload
          echo "IPA created successfully: $(ls -lh TeslaMIDI.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaMIDI-SideStore
          path: TeslaMIDI.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with Direct IPA Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "TeslaMIDI v1.3.0 - IPA con Nuova Icona Grafica"
          body: |
            ### ⚡ TeslaMIDI v1.3.0 - Bobina di Tesla Bluetooth Interrupter per iOS
            
            Novità in v1.3.0:
            - 🎨 **Nuova Icona App Dedicata**: icona ad alta risoluzione 1024x1024 con la bobina di Tesla al neon elettrico e onde sonore musicali su sfondo scuro metallico.
            - 🎶 **28 Brani MIDI Inclusi**: brani iconici già pronti all'avvio.
            - 🔊 **Anteprima Audio iPhone**: ascolto immediato tramite altoparlante del telefono.
            
            Scarica **`TeslaMIDI.ipa`** direttamente da Safari sul tuo iPhone e seleziona **Condividi -> Apri con SideStore** per installarla!
          files: TeslaMIDI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
