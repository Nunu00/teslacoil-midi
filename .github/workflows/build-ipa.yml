name: Build TeslaMIDI IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Inspect Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project TeslaMIDI/TeslaMIDI.xcodeproj \
            -scheme TeslaMIDI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TeslaMIDI.app Payload/
          zip -qr TeslaMIDI.ipa Payload
          rm -rf Payload
          echo "IPA created successfully: $(ls -lh TeslaMIDI.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaMIDI-SideStore
          path: TeslaMIDI.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with Direct IPA Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: "TeslaMIDI v1.7.0 - Importazione File MIDI a Tocco Singolo e Fix Pausa"
          body: |
            ### ⚡ TeslaMIDI v1.7.0 - Bobina di Tesla Bluetooth Interrupter per iOS
            
            Novità in v1.7.0:
            - 📁 **Risolto Definitivamente l'Import File MIDI (Tocco Singolo)**:
              - Sostituito il vecchio picker SwiftUI con `UIDocumentPickerViewController` nativo (`asCopy: true`).
              - **Apertura istantanea al tocco**: basta toccare il file `.mid` desiderato e si apre immediatamente! Non serve più premere il pulsante "Apri" (che su iOS causava conflitti di sandbox e mancata chiusura).
              - I file da iCloud Drive e memoria locale vengono copiati in modo sicuro nella sandbox e salvati permanentemente nella libreria dell'app.
              - Caricamento e riproduzione immediata sulla bobina di Tesla al tocco del file.
            - ⏸️ **Cerchio al Centro Perfettamente Fermo in Pausa**:
              - Il visualizzatore al centro arresta completamente la pulsazione appena si preme Pausa o Stop.
              - Visualizzazione chiara dello stato "PAUSA" in giallo e azzeramento del duty cycle.
            - 🔊 **Anteprima Altoparlante & ESP32 GPIO 0**:
              - Test audio immediato tramite altoparlante iPhone o trasmissione wireless BLE a ESP32-C3 SuperMini su GPIO 0.
            
            Scarica **`TeslaMIDI.ipa`** direttamente da Safari sul tuo iPhone e seleziona **Condividi -> Apri con SideStore** (o AltStore) per aggiornare!
          files: TeslaMIDI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
