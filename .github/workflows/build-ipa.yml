name: Build TeslaMIDI IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Inspect Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project TeslaMIDI/TeslaMIDI.xcodeproj \
            -scheme TeslaMIDI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TeslaMIDI.app Payload/
          zip -qr TeslaMIDI.ipa Payload
          rm -rf Payload
          echo "IPA created successfully: $(ls -lh TeslaMIDI.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaMIDI-SideStore
          path: TeslaMIDI.ipa
          retention-days: 30
          if-no-files-found: error
