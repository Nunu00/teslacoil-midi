name: Build TeslaMIDI IPA for SideStore

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Inspect Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Build Xcode Project (Unsigned for Sideloading)
        run: |
          xcodebuild clean build \
            -project TeslaMIDI/TeslaMIDI.xcodeproj \
            -scheme TeslaMIDI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA for SideStore / AltStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TeslaMIDI.app Payload/
          zip -qr TeslaMIDI.ipa Payload
          rm -rf Payload
          echo "IPA created successfully: $(ls -lh TeslaMIDI.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeslaMIDI-SideStore
          path: TeslaMIDI.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with Direct IPA Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.0
          name: "TeslaMIDI v1.8.0 - Supporto Dual-Mode: Wi-Fi UDP (ESP8266 NodeMCU) e Bluetooth (ESP32)"
          body: |
            ### ⚡ TeslaMIDI v1.8.0 - Bobina di Tesla MIDI Interrupter (Wi-Fi & Bluetooth)
            
            Novità in v1.8.0:
            - 📡 **Supporto Completo ESP8266 NodeMCU via Wi-Fi UDP**:
              - Trasmissione pacchetti MIDI a bassissima latenza via UDP (porta 5004).
              - Supporto Access Point SoftAP dell'ESP8266 (`TeslaCoil-NodeMCU`) e monitoraggio ping in tempo reale in ms.
              - Firmware ESP8266 dedicato con **Timer1 hardware a 160 MHz** per la generazione di impulsi con precisione al microsecondo e immunità al jitter Wi-Fi.
              - Uscita sicura su pin **D1 (GPIO 5)** del NodeMCU.
              - Web server di emergenza integrato a bordo dell'ESP8266 (`http://192.168.4.1`) con Kill switch.
            - 🔄 **Selettore Connessione Dual-Mode**:
              - Passa agevolmente da **Bluetooth (ESP32)** a **Wi-Fi UDP (NodeMCU)** con un tocco.
              - Indicatori di stato dedicati nella barra superiore (dBm per BLE, ping ms per Wi-Fi) e nella barra di navigazione.
              - Pulsante di test acustico (440 Hz La) e Kill Switch remoto via Wi-Fi.
            - 🛡️ **Tutte le protezioni di sicurezza mantenute**:
              - Watchdog di sicurezza a 500 ms (spegnimento istantaneo se si perde il segnale Wi-Fi o Bluetooth).
              - Limiti hardware clampati: On-time 10–180 µs, Duty Cycle max 15%.
            
            Scarica **`TeslaMIDI.ipa`** direttamente da Safari sul tuo iPhone e seleziona **Condividi -> Apri con SideStore** (o AltStore) per installare!
          files: TeslaMIDI.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
